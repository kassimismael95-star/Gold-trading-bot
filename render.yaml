services:
  - type: web
    name: gold-scalper-control-plane
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      - key: SECRET_KEY
        sync: false

      - key: DATABASE_URL
        sync: false

      - key: ENABLE_LIVE_TRADING
        value: "true"

      - key: LIVE_TRADING_AUTHORIZED
        value: "false"

      - key: WORKER_SHARED_SECRET
        sync: false
