services:
  - type: web
    name: bossmode-control-plane
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: ./start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        sync: false
      - key: WORKER_SHARED_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ALLOWED_LICENSES
        sync: false
      - key: WORKER_API_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: bossmode-postgres
          property: connectionString
