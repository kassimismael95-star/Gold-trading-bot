services:
  - type: web
    name: gold-scalper-control-plane
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ENABLE_LIVE_TRADING
        value: true
      - key: LIVE_TRADING_AUTHORIZED
        value: false
      - key: WORKER_SHARED_SECRET
        sync: false

databases:
  - name: gold-scalper-database
    plan: free
    databaseName: gold_scalper
    user: gold_scalper_user
