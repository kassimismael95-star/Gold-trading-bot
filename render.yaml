services:
  - type: web
    name: gold-trading-bot-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir . apps.api.app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /api/health/live
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: APP_SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: AGENT_SHARED_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: FLW_PUBLIC_KEY
        sync: false
      - key: FLW_SECRET_KEY
        sync: false
      - key: FLW_REDIRECT_URL
        sync: false
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ALLOW_LIVE_TRADING
        value: "false"
      - key: AUTO_CREATE_DB
        value: "false"
      - key: ENABLE_BALANCE_SYNC_LOOP
        value: "true"
      - key: BALANCE_SYNC_INTERVAL_SECONDS
        value: "3600"
      - key: FLW_WEBHOOK_HASH
        sync: false
